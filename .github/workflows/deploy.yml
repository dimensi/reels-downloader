name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: reels-downloader-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Open deployment tunnel
        env:
          COOLIFY_SSH_HOST: ${{ secrets.COOLIFY_SSH_HOST }}
          COOLIFY_SSH_PORT: ${{ secrets.COOLIFY_SSH_PORT }}
          COOLIFY_SSH_USER: ${{ secrets.COOLIFY_SSH_USER }}
          COOLIFY_SSH_KEY: ${{ secrets.COOLIFY_SSH_KEY }}
          COOLIFY_SSH_KNOWN_HOSTS: ${{ secrets.COOLIFY_SSH_KNOWN_HOSTS }}
        run: python3 scripts/coolify-tunnel.py start
      - name: Deploy and verify
        env:
          COOLIFY_URL: http://127.0.0.1:18000
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          DEPLOY_SHA: ${{ github.sha }}
        run: python3 scripts/deploy-coolify.py
      - name: Close deployment tunnel
        if: always()
        run: python3 scripts/coolify-tunnel.py stop
