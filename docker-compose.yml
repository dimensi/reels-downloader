services:
  reels-downloader:
    image: ${DOCKER_IMAGE:-reels-downloader:latest}
    container_name: reels-downloader
    ports:
      - "3001:3000"
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DOWNLOADS_PATH=/app/downloads
      - MAX_FILE_SIZE_MB=50
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=10
    volumes:
      - ./downloads:/app/downloads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - web

networks:
  web:
    external: true
